<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JSS Management System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --nav:#07324f;
 --nav2:#0b4265;
 --primary:#087fbd;
 --green:#159447;
 --danger:#d9363e;
 --bg:#f3f7fb;
 --white:#fff;
 --text:#172536;
 --muted:#687789;
 --border:#dce5ed;
 --shadow:0 4px 18px rgba(0,0,0,.07);
}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
 width:245px;
 background:var(--nav);
 color:white;
 position:fixed;
 left:0;top:0;bottom:0;
 z-index:20;
 overflow-y:auto;
}
.brand{
 padding:20px 15px;
 display:flex;
 align-items:center;
 gap:10px;
 border-bottom:1px solid rgba(255,255,255,.12);
}
.logo{
 width:42px;height:42px;
 border-radius:10px;
 background:white;
 color:var(--nav);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold;
}
.brand h2{font-size:17px;margin:0}
.brand small{display:block;opacity:.7;margin-top:3px}
.nav{padding:12px}
.nav button{
 width:100%;
 border:0;
 background:transparent;
 color:white;
 text-align:left;
 padding:12px 13px;
 border-radius:8px;
 margin-bottom:4px;
 font-size:14px;
}
.nav button:hover,.nav button.active{background:var(--nav2)}
.main{
 margin-left:245px;
 width:calc(100% - 245px);
 min-height:100vh;
}
.topbar{
 height:64px;
 background:white;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 25px;
 position:sticky;
 top:0;
 z-index:10;
}
.topbar h1{font-size:20px;margin:0}
.menuBtn{display:none}
.status{
 font-size:12px;
 color:var(--green);
 font-weight:bold;
}
.content{padding:25px}
.page{display:none}
.page.active{display:block}
.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px;
 margin-bottom:20px;
}
.card{
 background:white;
 border:1px solid var(--border);
 border-radius:12px;
 padding:18px;
 box-shadow:var(--shadow);
}
.stat-title{color:var(--muted);font-size:13px}
.stat-number{
