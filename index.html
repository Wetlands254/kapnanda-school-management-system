<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JSS School Management System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
 --primary:#075985;
 --secondary:#0f766e;
 --green:#15803d;
 --orange:#ea580c;
 --red:#dc2626;
 --purple:#7e22ce;
 --dark:#0f172a;
 --light:#f1f5f9;
 --white:#fff;
 --border:#dbe3ec;
}
body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#f1f5f9;
 color:#0f172a;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{
 background:linear-gradient(135deg,#075985,#0f766e);
 color:white;
 padding:16px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 position:sticky;
 top:0;
 z-index:20;
 box-shadow:0 2px 10px #0002;
}
.brand h1{margin:0;font-size:21px}
.brand small{opacity:.85}
.menuBtn{
 background:#ffffff22;
 color:white;
 border:1px solid #ffffff55;
 padding:9px 12px;
 border-radius:8px;
}
.layout{display:flex;min-height:calc(100vh - 68px)}
.sidebar{
 width:245px;
 background:#0f172a;
 color:white;
 padding:15px 10px;
 position:fixed;
 top:68px;
 bottom:0;
 overflow-y:auto;
 transition:.25s;
 z-index:15;
}
.sidebar.hide{transform:translateX(-100%)}
.navTitle{
 color:#94a3b8;
 font-size:11px;
 padding:16px 12px 7px;
 text-transform:uppercase;
}
.nav{
 width:100%;
 text-align:left;
 border:0;
 background:transparent;
 color:#cbd5e1;
 padding:11px 12px;
 margin:2px 0;
 border-radius:8px;
}
.nav:hover,.nav.active{
 background:#075985;
 color:white;
}
.main{
 margin-left:245px;
 width:calc(100% - 245px);
 padding:20px;
}
.page{display:none}
.page.active{display:block}
h2{margin-top:0}
.cards{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
 gap:14px;
}
.card{
 background:white;
 border:1px solid var(--border);
 border-radius:12px;
 padding:17px;
 box-shadow:0 2px 6px #00000008;
}
.card .number{font-size:28px;font-weight:bold;margin-top:7px}
.card.blue{border-left:5px solid var(--primary)}
.card.green{border-left:5px solid var(--green)}
.card.orange{border-left:5px solid var(--orange)}
.card.purple{border-left:5px solid var(--purple)}
.panel{
 background:white;
 border:1px solid var(--border);
 border-radius:12px;
 padding:18px;
 margin-top:18px;
 box-shadow:0 2px 6px #00000008;
}
.panelTitle{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
 margin-bottom:14px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
 gap:12px;
}
label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}
input,select,textarea{
 width:100%;
 border:1px solid #cbd5e1;
 border-radius:7px;
 padding:10px;
 background:white;
}
textarea{min-height:80px}
.btn{
 border:0;
 border-radius:7px;
 padding:10px 14px;
 color:white;
 background:var(--primary);
 margin:3px;
}
.btn.green{background:var(--green)}
.btn.orange{background:var(--orange)}
.btn.red{background:var(--red)}
.btn.purple{background:var(--purple)}
.btn.gray{background:#475569}
.btn.light{background:#e2e8f0;color:#0f172a}
table{
 width:100%;
 border-collapse:collapse;
 background:white;
}
th,td{
 border:1px solid #dbe3ec;
 padding:9px;
 text-align:left;
 font-size:13px;
}
th{
 background:#e2e8f0;
 font-weight:bold;
}
.tableWrap{overflow:auto}
.status{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold;
}
.present{background:#dcfce7;color:#166534}
.absent{background:#fee2e2;color:#991b1b}
.late{background:#ffedd5;color:#9a3412}
.balance{color:#dc2626;font-weight:bold}
.paid{color:#15803d;font-weight:bold}
.notice{
 padding:12px;
 border-radius:8px;
 background:#eff6ff;
 color:#1e40af;
 margin-bottom:12px;
}
.search{
 max-width:350px;
}
.loading{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 z-index:100;
 color:white;
 font-size:20px;
}
.loading.show{display:flex}
.toast{
 position:fixed;
 right:18px;
 bottom:18px;
 padding:13px 17px;
 background:#0f172a;
 color:white;
 border-radius:8px;
 display:none;
 z-index:200;
}
.toast.show{display:block}

/* PRINTING */
.printArea{display:none}

@media(max-width:800px){
 .sidebar{
  transform:translateX(-100%);
 }
 .sidebar.show{transform:translateX(0)}
 .main{
  margin-left:0;
  width:100%;
  padding:12px;
 }
 .topbar{padding:12px}
 .brand h1{font-size:17px}
 th,td{font-size:12px;padding:7px}
}

@media print{
 body{background:white}
 .topbar,.sidebar,.main>.page:not(.printPage),button,.noPrint{
  display:none!important;
 }
 .main{
  margin:0!important;
  width:100%!important;
  padding:0!important;
 }
 .printPage{
  display:block!important;
 }
 .printArea{
