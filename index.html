<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JSS School Management System</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033;
}
.sidebar{
position:fixed;
left:0;
top:0;
bottom:0;
width:235px;
background:#082b49;
color:white;
padding:20px 14px;
overflow-y:auto;
}
.logo{
width:48px;height:48px;
border-radius:12px;
background:white;color:#082b49;
display:flex;align-items:center;justify-content:center;
font-weight:bold;font-size:18px;
}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:25px}
.brand h2{font-size:16px}
.brand small{opacity:.7}
.nav button{
width:100%;
border:0;
background:transparent;
color:#dbe9f5;
padding:12px;
margin:3px 0;
border-radius:9px;
text-align:left;
font-weight:bold;
cursor:pointer;
}
.nav button:hover,.nav button.active{
background:#15598b;
color:white;
}
.main{
margin-left:235px;
padding:25px;
}
.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}
.top h1{color:#082b49}
.term{
background:#dff5e8;
color:#08743c;
padding:8px 14px;
border-radius:20px;
font-weight:bold;
}
.page{display:none}
.page.active{display:block}
.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
gap:15px;
margin-bottom:20px;
}
.card{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 3px 12px #0000000d;
border:1px solid #e2e9f0;
margin-bottom:20px;
}
.card h3{margin-bottom:8px}
.stat-number{
font-size:27px;
font-weight:bold;
color:#12629b;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}
button,.btn{
border:0;
padding:9px 15px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}
.primary{background:#1267a5;color:white}
.success{background:#078542;color:white}
.danger{background:#c62828;color:white}
.warning{background:#e49b16;color:white}
.light{background:#e9eef4;color:#172033}
.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}
input,select{
padding:10px;
border:1px solid #ccd7e2;
border-radius:8px;
width:100%;
}
.toolbar input,.toolbar select{
width:auto;
min-width:180px;
}
table{
width:100%;
border-collapse:collapse;
}
th{
background:#e8eff6;
padding:11px;
text-align:left;
}
td{
padding:10px;
border-bottom:1px solid #e5eaf0;
}
.table-wrap{overflow-x:auto}
.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
align-items:center;
justify-content:center;
padding:20px;
z-index:100;
}
.modal.show{display:flex}
.modal-box{
background:white;
width:100%;
max-width:650px;
max-height:90vh;
overflow:auto;
padding:25px;
border-radius:16px;
}
.modal-head{
display:flex;
justify-content:space-between;
margin-bottom:18px;
}
.close{
background:#eee;
border-radius:50%;
width:35px;
height:35px;
font-size:20px;
}
.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}
label{
font-weight:bold;
font-size:13px;
}
label input,label select{
margin-top:5px;
}
.progress{
height:10px;
background:#e5eaf0;
border-radius:20px;
overflow:hidden;
}
.progress-bar{
height:100%;
background:#1267a5;
}
.badge{
padding:5px 9px;
border-radius:15px;
font-size:11px;
font-weight:bold;
}
.paid{background:#d8f4e3;color:#08743c}
.due{background:#ffe5e5;color:#a71919}
.partial{background:#fff0cf;color:#8a5c00}
.print-box{
background:white;
padding:25px;
border:1px solid #ddd;
}
.footer{
text-align:center;
padding:25px;
color:#718096;
}
@media(max-width:800px){
.sidebar{width:65px;padding:10px}
.brand div:not(.logo),.nav b{display:none}
.main{margin-left:65px;padding:15px}
.form-grid{grid-template-columns:1fr}
}
@media print{
.sidebar,.top,.no-print{display:none!important}
.main{margin:0;padding:0}
.page{display:none!important}
.page.active{display:block!important}
.card{box-shadow:none;border:0}
.print-box{border:0}
body{background:white}
}
</style>
</head>

<body>

<aside class="sidebar">
<div class="brand">
<div class="logo">JSS</div>
<div>
<h2>JSS MANAGEMENT</h2>
<small>School System</small>
</div>
</div>

<nav class="nav">
<button class="active" onclick="showPage('dashboard',this)">📊 <b>Dashboard</b></button>
<button onclick="showPage('learners',this)">👨‍🎓 <b>Learners</b></button>
<button onclick="showPage('teachers',this)">👩‍🏫 <b>Teachers</b></button>
<button onclick="showPage('fees',this)">💰 <b>Fees</b></button>
<button onclick="showPage('marks',this)">📝 <b>Exams & Marks</b></button>
<button onclick="showPage('attendance',this)">📅 <b>Attendance</b></button>
<button onclick="showPage('reports',this)">🖨️ <b>Reports & Printing</b></button>
<button onclick="showPage('settings',this)">⚙️ <b>Settings</b></
